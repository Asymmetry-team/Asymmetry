[build]
# Install Chrome explicitly every build (Netlify caches node_modules, so
# puppeteer's postinstall download of Chromium is skipped on cached builds and
# the browser goes missing → prerender can't launch). `|| true` keeps a failed
# download from breaking the deploy; npm run build always runs afterwards.
command = "npx puppeteer browsers install chrome || true; npm run build"
publish = "dist"

[build.environment]
  # keep the install location and the prerender launch location in sync, inside
  # the build workspace (persisted for the whole build)
  PUPPETEER_CACHE_DIR = "/opt/build/repo/.cache/puppeteer"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
